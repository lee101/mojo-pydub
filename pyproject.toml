[project]
name = "mojo-pydub"
version = "0.1.0"
description = "pydub-compatible audio mixing and effects accelerated with Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "pydub", "audio", "dsp"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "pydub"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
